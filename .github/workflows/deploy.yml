name: CI & Deploy Backend to VPS

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  backend-ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nandibaag-bot/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: nandibaag-bot/backend/package-lock.json
      - run: npm ci
      - name: Run P0 Security & Regression Suites
        env:
          NODE_ENV: test
        run: |
          node tests/p0SecurityRemediation.test.js
          node tests/sprint1PricingEngine.test.js
          node tests/sprint2_1Hardening.test.js
          node tests/idempotencyRecovery.test.js
          node tests/sprint3GuestBookings.test.js
          node tests/sprint3_1Hardening.test.js
          node tests/sprint3_1_1Integrity.test.js
          node tests/sprint4Phase1Analytics.test.js
          node tests/sprint4Phase2StaffAnalytics.test.js

  frontend-ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nandibaag-bot/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: nandibaag-bot/frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  deploy:
    needs: [backend-ci, frontend-ci]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS with Health Check & Rollback
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            set -e
            cd /root/nandibaag-pms/nandibaag-bot
            PREV_SHA=$(git rev-parse HEAD)

            git fetch origin main
            git checkout --detach "${{ github.sha }}"

            cd backend
            npm ci --omit=dev
            pm2 restart nandibaag-backend

            sleep 3
            if ! curl -fsS --max-time 10 http://127.0.0.1:7000/api/health; then
              echo "Health check failed! Rolling back to $PREV_SHA..."
              cd /root/nandibaag-pms/nandibaag-bot
              git checkout --detach "$PREV_SHA"
              cd backend
              npm ci --omit=dev
              pm2 restart nandibaag-backend
              exit 1
            fi

            echo "Deployment completed and health check passed!"
            pm2 status
