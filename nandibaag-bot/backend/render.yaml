services:
  - type: web
    name: nandibaag-bot-backend
    env: node
    rootDir: nandibaag-bot/backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODEL_PRIMARY
        value: meta-llama/llama-3.3-70b-instruct
      - key: FRONTEND_URL
        sync: false
      - key: RESORT_CONTACT_1
        value: "9257657665"
      - key: RESORT_CONTACT_2
        value: "9257657664"
      - key: RESORT_CONTACT_3
        value: "9257657663"
      - key: ADMIN_DEFAULT_EMAIL
        value: "admin@nandibaag.com"
      - key: ADMIN_DEFAULT_PASSWORD
        sync: false
      - key: FAST2SMS_ENABLED
        value: "true"
